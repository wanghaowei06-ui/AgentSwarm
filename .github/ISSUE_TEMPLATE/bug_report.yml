name: Bug report
description: Report a reproducible problem in the AgentSwarm distribution or AgentTeams runtime included here.
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        请不要在公开 Issue 中粘贴 API Key、Token、密码、私有 URL、未脱敏 Matrix 事件或容器日志。
        安全漏洞请使用仓库 Security 页的私密报告入口，参见 SECURITY.md。
  - type: dropdown
    id: scope
    attributes:
      label: Scope
      description: Is the problem in this distribution layer or the runtime?
      options:
        - AgentSwarm distribution/docs
        - AgentTeams runtime
        - Dashboard
        - Unsure
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Bug description
      description: What happened, and what did you expect?
      placeholder: |
        What happened:
        What I expected:
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Give the smallest reproducible sequence.
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      description: For example, the output of git rev-parse --short HEAD.
      placeholder: competition-v1.2 or abc1234
    validations:
      required: true
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - Controller
        - Manager
        - OpenClaw Worker
        - QwenPaw/CoPaw Worker
        - Hermes Worker
        - OpenHuman Worker
        - Matrix/Gateway/Storage
        - Install/Helm
        - Dashboard
        - TestWeaver
        - Other
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include OS, Docker/Compose or Kubernetes versions, and model provider without exposing credentials.
      placeholder: |
        OS:
        Docker or Kubernetes:
        Model provider/model:
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Redacted logs
      description: Paste only logs with secrets, tokens, personal data, and internal URLs removed.
      render: shell
    validations:
      required: false
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched existing issues and removed sensitive information from this report.
          required: true
        - label: This is not a private security vulnerability.
          required: true
